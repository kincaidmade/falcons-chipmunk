<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Falcons Hockey — Tournament</title>
<link rel="stylesheet" href="style.css">
  <script data-goatcounter="https://kincaidmade.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo-block">
      <div class="logo-icon" aria-hidden="true">
        <img src="FalconsLogo.png" alt="Falcons logo" style="height:52px;width:52px;object-fit:contain;">
      </div>
      <div>
        <div class="team-name">Falcons</div>
        <div class="season-label" id="season-label">2026</div>
      </div>
    </div>
    <nav class="site-nav">
      <a href="leaderboard.html" class="nav-link">Leaderboard</a>
      <a href="tournament.html" class="nav-link active">Tournaments</a>
      <a href="opponents.html" class="nav-link">Opponents</a>
    </nav>
  </div>
</header>

<main class="main-content">
  <a href="tournament.html" class="back-link">← Back to tournaments</a>
  <div id="detail-content"><p class="loading-cell">Loading tournament…</p></div>
</main>

<footer class="site-footer">
  <span>Falcons Hockey</span>
</footer>

<script>
async function loadData() {
  const params = new URLSearchParams(window.location.search);
  const tid = params.get('t');

  let data;
  try {
    const res = await fetch('data/stats.json');
    data = await res.json();
  } catch(e) {
    document.getElementById('detail-content').innerHTML =
      '<p class="loading-cell" style="color:#c0392b">Could not load stats.json.</p>';
    return;
  }

  document.getElementById('season-label').textContent = (data.season || '') + ' Season';

  const t = data.tournaments.find(t => t.id === tid);
  if (!t) {
    document.getElementById('detail-content').innerHTML =
      '<p class="loading-cell">Tournament not found. <a href="tournament.html">Back to tournaments</a></p>';
    return;
  }

  document.title = `${t.name} — Falcons Hockey`;

  let w = 0, l = 0, tie = 0, gf = 0, ga = 0;
  t.games.filter(g => !g.upcoming).forEach(g => {
    gf += g.falcons_score; ga += g.opponent_score;
    if (g.falcons_score > g.opponent_score) w++;
    else if (g.falcons_score < g.opponent_score) l++;
    else tie++;
  });

  const playerMap = {};
  data.players.forEach(p => {
    playerMap[p.id] = { ...p, gp: 0, goals: 0, assists: 0, ps_goals: 0, pim: 0, shutouts: 0 };
  });
  t.games.filter(g => !g.upcoming).forEach(g => {
    if (!g.stats || g.stats.length === 0) return;
    g.stats.forEach(s => {
      if (!playerMap[s.player_id]) return;
      playerMap[s.player_id].gp++;
      playerMap[s.player_id].goals    += s.goals    || 0;
      playerMap[s.player_id].assists  += s.assists  || 0;
      playerMap[s.player_id].ps_goals += s.ps_goals || 0;
      playerMap[s.player_id].pim      += s.pim      || 0;
      playerMap[s.player_id].shutouts += s.shutout  || 0;
    });
  });
  const players = Object.values(playerMap)
    .map(p => ({ ...p, points: p.goals + p.assists }))
    .sort((a, b) => b.points - a.points || b.goals - a.goals);

  const resultBadge = t.result
    ? `<span class="tournament-result-badge ${t.result.toLowerCase().includes('champion') ? 'badge-champion' : 'badge-finalist'}">${t.result}</span>`
    : '';

  const isUpcoming = t.games.filter(g => g.stats && g.stats.length > 0).length === 0;

  const gameRows = t.games.map(g => {
    if (g.upcoming) {
      return `<div class="game-card" style="opacity:0.6">
        <span class="result-badge" style="background:var(--gray-100);color:var(--gray-400);width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:11px;font-weight:700">TBD</span>
        <div class="game-info">
          <span class="game-opponent">vs ${g.opponent}</span>
          <span style="font-size:12px;color:var(--gray-400)">Upcoming</span>
        </div>
        <span class="game-date">${formatDate(g.date)}</span>
      </div>`;
    }
    const result = g.falcons_score > g.opponent_score ? 'W' :
                   g.falcons_score < g.opponent_score ? 'L' : 'T';
    const cls = result === 'W' ? 'result-w' : result === 'L' ? 'result-l' : 'result-t';
    return `<div class="game-card">
      <span class="result-badge ${cls}">${result}</span>
      <div class="game-info">
        <span class="game-opponent">vs ${g.opponent}</span>
        <span class="game-score">${g.falcons_score}–${g.opponent_score}${g.note === 'OT' ? '<span class="ot-badge">OT</span>' : ''}</span>
      </div>
      <span class="game-date">${formatDate(g.date)}</span>
    </div>`;
  }).join('');

  const playerRows = players.map((p, i) => `
    <tr>
      <td class="col-rank">${i + 1}</td>
      <td class="col-player">
        <span class="player-num">#${p.number}</span>
        <a class="player-name player-link" href="player.html?id=${p.id}">${p.name}</a>
      </td>
      <td class="col-pos"><span class="pos-badge pos-${p.position}">${p.position}</span></td>
      <td class="col-stat">${p.gp}</td>
      <td class="col-stat">${p.goals}</td>
      <td class="col-stat">${p.assists}</td>
      <td class="col-stat col-pts">${p.points}</td>
      <td class="col-stat">${p.ps_goals}</td>
      <td class="col-stat">${p.shutouts || 0}</td>
    </tr>`).join('');

  const sheetLinks = {
    't4': 'https://docs.google.com/spreadsheets/d/1GzpMbI44aZDjzLrjmgq_0NgYSCtY-n1qy6zwY5zNt88/edit?usp=drivesdk',
    't5': 'https://docs.google.com/spreadsheets/d/1--2osCJk6fPt_0tyUegEgLT8xKgLI72zfMDeRpI5GCw/edit',
    't6': 'https://docs.google.com/spreadsheets/d/1SASt4rEtCsaRzJWs39PfaMu_ulOqE_Dy/edit?rtpof=true&gid=850166210#gid=850166210',
    't7': 'https://docs.google.com/spreadsheets/d/1en-0Csv78X78DL1_s6Tseqmx3dws6RdoGlGTB6vGQ3U/edit?gid=739102748#gid=739102748',
  };
  const sheetLink = sheetLinks[t.id]
    ? `<a href="${sheetLinks[t.id]}" target="_blank" class="sheet-link-btn">📊 View Tournament Schedule</a>`
    : '';

  document.getElementById('detail-content').innerHTML = `

    <div class="td-hero">
      <div class="td-hero-info">
        <div class="td-title-row">
          <h1 class="td-name">${t.name}</h1>
          ${resultBadge}
        </div>
        <div class="td-meta">${formatDate(t.date)}${t.location ? ' · ' + t.location : ''}</div>
        ${sheetLink}
      </div>
      ${!isUpcoming ? `
      <div class="td-record-block">
        <div class="td-record">${w}–${l}–${tie}</div>
        <div class="td-record-sub">GF ${gf} · GA ${ga}</div>
      </div>` : `
      <div class="td-upcoming-badge">Upcoming</div>`}
    </div>

    ${!isUpcoming ? `
    <h2 class="section-title">Games</h2>
    <div class="game-log-mini">${gameRows}</div>

    <h2 class="section-title" style="margin-top:28px">Player stats</h2>
    <div class="table-wrap">
      <table class="stats-table">
        <thead>
          <tr>
            <th class="col-rank">#</th>
            <th class="col-player">Player</th>
            <th class="col-pos">Pos</th>
            <th class="col-stat">GP</th>
            <th class="col-stat">G</th>
            <th class="col-stat">A</th>
            <th class="col-stat">PTS</th>
            <th class="col-stat">PS</th>
            <th class="col-stat">SO</th>
          </tr>
        </thead>
        <tbody>${playerRows}</tbody>
      </table>
    </div>` : `
    <div class="upcoming-card">
      <div class="upcoming-icon">🗓</div>
      <div class="upcoming-text">This tournament hasn't been played yet. Stats will appear here once games are logged.</div>
    </div>`}
  `;
}

function formatDate(d) {
  if (!d) return '';
  const dt = new Date(d + 'T12:00:00');
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

loadData();
</script>
</body>
</html>
