<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Falcons Hockey — Player Profile</title>
<link rel="stylesheet" href="style.css">
  <script data-goatcounter="https://kincaidmade.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo-block">
      <div class="logo-icon" aria-hidden="true">
        <img src="FalconsLogo.png" alt="Falcons logo" style="height:52px;width:52px;object-fit:contain;">
      </div>
      <div>
        <div class="team-name">Falcons</div>
        <div class="season-label" id="season-label">2026</div>
      </div>
    </div>
    <nav class="site-nav">
      <a href="index.html" class="nav-link">Leaderboard</a>
      <a href="tournament.html" class="nav-link">Tournaments</a>
    </nav>
  </div>
</header>

<main class="main-content">
  <a href="index.html" class="back-link">← Back to leaderboard</a>
  <div id="profile-content"><p class="loading-cell">Loading player…</p></div>
</main>

<footer class="site-footer">
  <span>Falcons Hockey</span>
  <span>·</span>
  <a href="index.html">Leaderboard</a>
</footer>

<script>
async function loadData() {
  const params = new URLSearchParams(window.location.search);
  const playerId = parseInt(params.get('id'));

  let data;
  try {
    const res = await fetch('data/stats.json');
    data = await res.json();
  } catch(e) {
    document.getElementById('profile-content').innerHTML =
      '<p class="loading-cell" style="color:#c0392b">Could not load stats.json.</p>';
    return;
  }

  document.getElementById('season-label').textContent = (data.season || '') + ' Season';

  const player = data.players.find(p => p.id === playerId);
  if (!player) {
    document.getElementById('profile-content').innerHTML =
      '<p class="loading-cell">Player not found. <a href="index.html">Back to leaderboard</a></p>';
    return;
  }

  // Build game-by-game log
  const gamelog = [];
  data.tournaments.forEach(t => {
    t.games.forEach(g => {
      const stat = g.stats.find(s => s.player_id === playerId);
      if (stat) {
        gamelog.push({
          date: g.date,
          opponent: g.opponent,
          falcons_score: g.falcons_score,
          opponent_score: g.opponent_score,
          tournament: t.name,
          goals: stat.goals || 0,
          assists: stat.assists || 0,
          ps_goals: stat.ps_goals || 0,
          pim: stat.pim || 0,
          shutout: stat.shutout || 0,
          points: (stat.goals || 0) + (stat.assists || 0)
        });
      }
    });
  });

  // Season totals
  const name  = player.name;
  const gp    = player.gp_override || 0;
  const goals = gamelog.reduce((s, g) => s + g.goals, 0);
  const assists = gamelog.reduce((s, g) => s + g.assists, 0);
  const points  = goals + assists;
  const ps_goals = gamelog.reduce((s, g) => s + g.ps_goals, 0);
  const pim      = gamelog.reduce((s, g) => s + g.pim, 0);
  const shutouts = gamelog.reduce((s, g) => s + (g.shutout || 0), 0);
  const gpg     = gp > 0 ? (goals / gp).toFixed(2) : '—';
  const apg     = gp > 0 ? (assists / gp).toFixed(2) : '—';
  const ppg     = gp > 0 ? (points / gp).toFixed(2) : '—';

  // Season rank
  const allTotals = data.players.map(p => {
    let g = 0, a = 0;
    data.tournaments.forEach(t => t.games.forEach(game => {
      const s = game.stats.find(s => s.player_id === p.id);
      if (s) { g += s.goals || 0; a += s.assists || 0; }
    }));
    return { id: p.id, pts: g + a };
  }).sort((a, b) => b.pts - a.pts);
  const rank = allTotals.findIndex(p => p.id === playerId) + 1;

  // Tournament breakdown
  const byTournament = {};
  data.tournaments.forEach(t => {
    let tg = 0, ta = 0, tps = 0, tpim = 0, tgames = 0;
    t.games.forEach(g => {
      const s = g.stats.find(s => s.player_id === playerId);
      if (s) {
        tgames++;
        tg   += s.goals    || 0;
        ta   += s.assists  || 0;
        tps  += s.ps_goals || 0;
        tpim += s.pim      || 0;
      }
    });
    if (tgames > 0 || t.games.length > 0) {
      byTournament[t.id] = { name: t.name, gp: tgames, goals: tg, assists: ta, ps_goals: tps, pim: tpim, points: tg + ta };
    }
  });

  const gamelogRows = gamelog.map(g => {
    const result = g.falcons_score > g.opponent_score ? 'W' :
                   g.falcons_score < g.opponent_score ? 'L' : 'T';
    const cls = result === 'W' ? 'result-w' : result === 'L' ? 'result-l' : 'result-t';
    return `<tr>
      <td>${formatDate(g.date)}</td>
      <td><span class="result-badge ${cls}" style="display:inline-flex;width:22px;height:22px;font-size:12px;border-radius:4px">${result}</span></td>
      <td class="col-player" style="text-align:left">vs ${g.opponent}</td>
      <td class="col-stat">${g.goals}</td>
      <td class="col-stat">${g.assists}</td>
      <td class="col-stat col-pts">${g.points}</td>
      <td class="col-stat">${g.ps_goals}</td>
      <td class="col-stat">${g.pim}</td>
      <td style="font-size:12px;color:var(--gray-400);white-space:nowrap">${g.tournament}</td>
    </tr>`;
  }).join('');

  const tournamentRows = Object.values(byTournament).map(t => `
    <tr>
      <td class="col-player" style="text-align:left;font-weight:500">${t.name}</td>
      <td class="col-stat">${t.gp}</td>
      <td class="col-stat">${t.goals}</td>
      <td class="col-stat">${t.assists}</td>
      <td class="col-stat col-pts">${t.points}</td>
      <td class="col-stat">${t.ps_goals}</td>
      <td class="col-stat">${t.pim}</td>
    </tr>`).join('');

  document.title = `${player.name} — Falcons Hockey`;

  document.getElementById('profile-content').innerHTML = `

    <div class="profile-hero">
      <div class="profile-jersey">
        <div class="jersey-number">${player.number}</div>
        <div class="jersey-label">FALCONS</div>
      </div>
      <div class="profile-info">
        <div class="profile-name">${player.name}</div>
        <div class="profile-meta">
          <span class="pos-badge pos-${player.position}" style="font-size:13px;padding:3px 10px">${player.position}</span>
          <span class="profile-rank">Season rank: <strong>#${rank}</strong></span>
        </div>
        <div class="profile-stat-pills">
          <div class="stat-pill">
            <div class="stat-pill-val">${gp}</div>
            <div class="stat-pill-label">GP</div>
          </div>
          <div class="stat-pill stat-pill-blue">
            <div class="stat-pill-val">${goals}</div>
            <div class="stat-pill-label">G</div>
          </div>
          <div class="stat-pill stat-pill-blue">
            <div class="stat-pill-val">${assists}</div>
            <div class="stat-pill-label">A</div>
          </div>
          <div class="stat-pill stat-pill-dark">
            <div class="stat-pill-val">${points}</div>
            <div class="stat-pill-label">PTS</div>
          </div>
          ${ps_goals > 0 ? `<div class="stat-pill"><div class="stat-pill-val">${ps_goals}</div><div class="stat-pill-label">PS</div></div>` : ''}
          ${shutouts > 0 ? `<div class="stat-pill"><div class="stat-pill-val">${shutouts}</div><div class="stat-pill-label">SO</div></div>` : ''}
        </div>
        <div class="profile-rates">
          <span>${gpg} G/GP</span>
          <span>${apg} A/GP</span>
          <span>${ppg} PTS/GP</span>
        </div>
        <button class="share-btn" id="share-btn" onclick="generateShareCard()">🏒 Download hockey card</button>
      </div>
    </div>

    <!-- Live hockey card preview -->
    <h2 class="section-title" style="margin-top:28px">Hockey card</h2>
    <div class="hc-preview-wrap">
      <canvas id="hc-preview-canvas" class="hc-preview-canvas"></canvas>
      <div class="hc-preview-hint">Click the card or use the button above to download</div>
    </div>

    <!-- Hidden full-res download canvas -->
    <canvas id="share-canvas" style="display:none"></canvas>

    <h2 class="section-title" style="margin-top:28px">By tournament</h2>
    <div class="table-wrap">
      <table class="stats-table">
        <thead>
          <tr>
            <th class="col-player" style="text-align:left">Tournament</th>
            <th class="col-stat">GP</th>
            <th class="col-stat">G</th>
            <th class="col-stat">A</th>
            <th class="col-stat">PTS</th>
            <th class="col-stat">PS</th>
            <th class="col-stat">PIM</th>
          </tr>
        </thead>
        <tbody>${tournamentRows}</tbody>
      </table>
    </div>

    <h2 class="section-title" style="margin-top:28px">Game log</h2>
    ${gamelog.length === 0
      ? '<p class="no-games">No games logged yet.</p>'
      : `<div class="table-wrap">
          <table class="stats-table">
            <thead>
              <tr>
                <th style="text-align:left;padding-left:12px">Date</th>
                <th></th>
                <th class="col-player" style="text-align:left">Opponent</th>
                <th class="col-stat">G</th>
                <th class="col-stat">A</th>
                <th class="col-stat">PTS</th>
                <th class="col-stat">PS</th>
                <th class="col-stat">PIM</th>
                <th style="text-align:left">Tournament</th>
              </tr>
            </thead>
            <tbody>${gamelogRows}</tbody>
          </table>
        </div>`
    }
  `;

  // Render hockey card preview
  renderHockeyCardPreview({ name, number: player.number, position: player.position,
    rank, gp, goals, assists, points, ps_goals, pim, gpg, apg, ppg,
    season: data.season || '2026' });
}

function formatDate(d) {
  if (!d) return '';
  const dt = new Date(d + 'T12:00:00');
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

let _cardData = null;

function generateShareCard() {
  if (!_cardData) return;
  const logo = new Image();
  logo.crossOrigin = 'anonymous';
  logo.src = 'FalconsLogo.png';
  logo.onload  = () => drawCard(_cardData, logo, 'download');
  logo.onerror = () => drawCard(_cardData, null, 'download');
}

function renderHockeyCardPreview(cardData) {
  _cardData = cardData;
  const logo = new Image();
  logo.crossOrigin = 'anonymous';
  logo.src = 'FalconsLogo.png';
  logo.onload  = () => drawCard(cardData, logo, 'preview');
  logo.onerror = () => drawCard(cardData, null, 'preview');
}

function drawCard(cardData, logo, mode) {
  const CW = 500, CH = 700, SCALE = 3;
  const RW = CW * SCALE, RH = CH * SCALE;
  const isPreview = mode === 'preview';
  const canvas = isPreview
    ? document.getElementById('hc-preview-canvas')
    : document.getElementById('share-canvas');
  if (!canvas) return;
  canvas.width = RW; canvas.height = RH;
  if (isPreview) { canvas.style.width = CW + 'px'; canvas.style.height = CH + 'px'; }
  const ctx = canvas.getContext('2d');
  ctx.scale(SCALE, SCALE);

  const { name, number, position, rank, gp, goals, assists, points, ps_goals, gpg, apg, ppg, season } = cardData;

  // Background
  const bg = ctx.createLinearGradient(0, 0, CW, CH);
  bg.addColorStop(0, '#12104A'); bg.addColorStop(0.5, '#1E1B52'); bg.addColorStop(1, '#2E2B6E');
  ctx.fillStyle = bg; rrFill(ctx, 0, 0, CW, CH, 16);

  // Top accent stripe
  const stripe = ctx.createLinearGradient(0, 0, CW, 0);
  stripe.addColorStop(0, '#4A46A0'); stripe.addColorStop(1, '#2E2B6E');
  ctx.fillStyle = stripe; rrFill(ctx, 0, 0, CW, 8, 0);

  // Diagonal lines watermark
  ctx.save(); ctx.globalAlpha = 0.04; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
  for (let i = -CH; i < CW + CH; i += 28) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i+CH,CH); ctx.stroke(); }
  ctx.restore();

  // Large number watermark
  ctx.save(); ctx.globalAlpha = 0.05; ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.round(CW*0.75) + 'px Arial Narrow, sans-serif';
  ctx.textAlign = 'center'; ctx.fillText('#'+number, CW/2, CH*0.58); ctx.restore();

  // Logo — centered top
  const logoSize = 140, logoX = (CW-logoSize)/2, logoY = 28;
  if (logo) { ctx.save(); ctx.globalAlpha = 0.92; ctx.drawImage(logo, logoX, logoY, logoSize, logoSize); ctx.restore(); }

  // Banner
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; rrFill(ctx, 30, logoY+logoSize+10, CW-60, 22, 4);
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '500 11px Arial, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText("BILL'S DEK HOCKEY  ·  FALCONS  ·  "+season, CW/2, logoY+logoSize+25);

  // Large number watermark
  ctx.save(); ctx.globalAlpha = 0.05; ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.round(CW*0.75) + 'px Arial Narrow, sans-serif';
  ctx.textAlign = 'center'; ctx.fillText('#'+number, CW/2, CH*0.58); ctx.restore();

  // Jersey number badge
  const numY = logoY+logoSize+46;
  ctx.fillStyle = 'rgba(255,255,255,0.1)'; rrFill(ctx, CW/2-36, numY, 72, 36, 8);
  ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1; rrStroke(ctx, CW/2-36, numY, 72, 36, 8);
  ctx.fillStyle = 'white'; ctx.font = 'bold 22px Arial Narrow, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('#'+number, CW/2, numY+24);

  // Position pill
  const pillY = numY+46;
  const posLabel = position==='F'?'FORWARD':position==='D'?'DEFENSE':position==='G'?'GOALIE':position;
  const pillText = posLabel+'  ·  RANK #'+rank;
  ctx.font = '500 11px Arial, sans-serif';
  const pillW = ctx.measureText(pillText).width+28;
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; rrFill(ctx, (CW-pillW)/2, pillY, pillW, 22, 11);
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText(pillText, CW/2, pillY+15);

  // Divider
  const divY = pillY+36;
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(30,divY); ctx.lineTo(CW-30,divY); ctx.stroke();

  // Stat grid
  const statList = [{label:'GP',val:gp},{label:'G',val:goals},{label:'A',val:assists},{label:'PTS',val:points},{label:'PS',val:ps_goals}];
  const cols=5, cellW=(CW-60)/cols, cellH=72, gridX=30, gridY=divY+12;
  statList.forEach((s,i) => {
    const cx = gridX+i*cellW+cellW/2;
    const hi = s.label==='PTS';
    ctx.fillStyle = hi?'rgba(255,255,255,0.14)':'rgba(255,255,255,0.06)';
    rrFill(ctx, gridX+i*cellW+3, gridY, cellW-6, cellH, 8);
    if (hi) { ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1; rrStroke(ctx, gridX+i*cellW+3, gridY, cellW-6, cellH, 8); }
    ctx.fillStyle = hi?'#fff':'rgba(255,255,255,0.9)';
    ctx.font = 'bold ' + (s.val>=10?28:32) + 'px Arial Narrow, sans-serif'; ctx.textAlign='center';
    ctx.fillText(String(s.val), cx, gridY+44);
    ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.font='500 10px Arial, sans-serif';
    ctx.fillText(s.label, cx, gridY+62);
  });

  // Per-game rates
  const rateY = gridY+cellH+14;
  ctx.fillStyle='rgba(255,255,255,0.08)'; rrFill(ctx, 30, rateY, CW-60, 28, 6);
  [{r:gpg+' G/GP',i:0},{r:apg+' A/GP',i:1},{r:ppg+' PTS/GP',i:2}].forEach(({r,i}) => {
    const rx = 30+((CW-60)/3)*i+(CW-60)/6;
    ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.font='400 11px Arial, sans-serif'; ctx.textAlign='center';
    ctx.fillText(r, rx, rateY+18);
  });

  // Bottom accent bar — drawn BEFORE name so name sits on top
  ctx.fillStyle='rgba(0,0,0,0.55)'; rrFill(ctx, 0, CH-90, CW, 90, 0);
  ctx.fillStyle='rgba(255,255,255,0.06)'; rrFill(ctx, 0, CH-6, CW, 6, 0);

  // ── Player name — drawn last, guaranteed on top ──
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = 'rgba(0,0,0,0.9)';
  ctx.shadowBlur = 8;
  ctx.letterSpacing = '4px';
  const nameFontSize = name.length > 16 ? 28 : name.length > 12 ? 33 : 38;
  ctx.font = '800 ' + nameFontSize + 'px Impact, Arial Narrow, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(name.toUpperCase(), CW / 2, CH - 46);
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';

  if (!isPreview) {
    const link = document.createElement('a');
    link.download = name.replace(/\s+/g,'-')+'-falcons-card.png';
    link.href = canvas.toDataURL('image/png'); link.click();
    burstConfetti(document.getElementById('share-btn'));
  }
  if (isPreview) { canvas.style.cursor='pointer'; canvas.onclick = generateShareCard; }
}

function rrFill(ctx,x,y,w,h,r) {
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath(); ctx.fill();
}
function rrStroke(ctx,x,y,w,h,r) {
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath(); ctx.stroke();
}

function burstConfetti(anchor) {
  const colors = ['#2E2B6E','#ffffff','#A9DFBF','#F9E79F','#AED6F1'];
  const rect = anchor.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  for (let i = 0; i < 36; i++) {
    const el = document.createElement('div');
    el.style.cssText = `position:fixed;width:8px;height:8px;border-radius:${Math.random()>0.5?'50%':'2px'};
      background:${colors[Math.floor(Math.random()*colors.length)]};
      left:${cx}px;top:${cy}px;pointer-events:none;z-index:9999;`;
    document.body.appendChild(el);
    const angle = (Math.random() * 360) * Math.PI / 180;
    const dist  = 60 + Math.random() * 120;
    const tx = Math.cos(angle) * dist;
    const ty = Math.sin(angle) * dist;
    el.animate([
      { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
      { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0) rotate(${Math.random()*360}deg)`, opacity: 0 }
    ], { duration: 700 + Math.random() * 400, easing: 'cubic-bezier(0,0,0.2,1)', fill: 'forwards' })
      .onfinish = () => el.remove();
  }
}

loadData();
</script>
</body>
</html>
