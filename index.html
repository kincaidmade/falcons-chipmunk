<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Falcons — Bill's Dek Hockey 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #1E1B52;
    --navy-dark: #12104A;
    --navy-mid: #2E2B6E;
    --white: #ffffff;
    --ice: rgba(255,255,255,0.07);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--navy-dark);
    font-family: 'Barlow', sans-serif;
    cursor: pointer;
    user-select: none;
  }

  /* ── Ice rink background ── */
  .rink {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 60%, #2E2B6E 0%, #1E1B52 40%, #0D0B35 100%);
  }

  /* Rink lines */
  .rink::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 55% 30% at 50% 50%, rgba(255,255,255,0.04) 0%, transparent 70%),
      repeating-linear-gradient(0deg, transparent, transparent 59px, rgba(255,255,255,0.015) 60px),
      repeating-linear-gradient(90deg, transparent, transparent 59px, rgba(255,255,255,0.015) 60px);
  }

  /* Center circle */
  .center-circle {
    position: fixed;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(420px, 85vw);
    height: min(420px, 85vw);
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.06);
    pointer-events: none;
  }
  .center-circle::before {
    content: '';
    position: absolute;
    inset: 20px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.04);
  }

  /* ── Logo ── */
  .logo-wrap {
    position: fixed;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    z-index: 10;
    animation: logo-drop 1s cubic-bezier(0.22,1,0.36,1) both;
  }
  @keyframes logo-drop {
    from { opacity: 0; transform: translate(-50%, calc(-50% - 30px)) scale(0.85); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  .logo-img {
    width: min(180px, 38vw);
    height: min(180px, 38vw);
    object-fit: contain;
    filter: drop-shadow(0 0 40px rgba(100,90,255,0.4)) drop-shadow(0 0 80px rgba(60,50,200,0.2));
    animation: logo-pulse 3s ease-in-out infinite;
  }
  @keyframes logo-pulse {
    0%, 100% { filter: drop-shadow(0 0 40px rgba(100,90,255,0.4)) drop-shadow(0 0 80px rgba(60,50,200,0.2)); }
    50%       { filter: drop-shadow(0 0 60px rgba(120,110,255,0.6)) drop-shadow(0 0 100px rgba(80,70,220,0.35)); }
  }

  /* ── Player name particles ── */
  .player {
    position: fixed;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: clamp(13px, 2vw, 18px);
    color: rgba(255,255,255,0.75);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 5;
    text-shadow: 0 0 20px rgba(150,140,255,0.5);
    transition: opacity 0.3s;
  }

  /* ── Enter prompt ── */
  .enter-wrap {
    position: fixed;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    z-index: 20;
    animation: fade-up 1.2s 0.8s cubic-bezier(0.22,1,0.36,1) both;
  }
  @keyframes fade-up {
    from { opacity: 0; transform: translateX(-50%) translateY(16px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  .enter-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(11px, 1.8vw, 14px);
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
  }
  .enter-btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(16px, 3vw, 22px);
    font-weight: 900;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--white);
    background: none;
    border: 1.5px solid rgba(255,255,255,0.25);
    border-radius: 40px;
    padding: 12px 36px;
    cursor: pointer;
    animation: btn-pulse 2s ease-in-out infinite;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
  }
  .enter-btn:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.5);
    transform: scale(1.04);
  }
  @keyframes btn-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.0); }
    50%       { box-shadow: 0 0 0 8px rgba(255,255,255,0.04); }
  }

  /* ── Season tag ── */
  .season-tag {
    position: fixed;
    top: 32px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(11px, 1.6vw, 13px);
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.25);
    z-index: 20;
    animation: fade-up 1s 0.3s both;
  }

  /* ── Page transition ── */
  .curtain {
    position: fixed;
    inset: 0;
    background: var(--navy-dark);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .curtain.closing { opacity: 1; pointer-events: all; }

  @media (prefers-reduced-motion: reduce) {
    .player { animation: none !important; }
    .logo-img { animation: none !important; }
  }
</style>
<script data-goatcounter="https://kincaidmade.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<div class="rink"></div>
<div class="center-circle"></div>
<div class="curtain" id="curtain"></div>

<div class="season-tag">Bill's Dek Hockey · 2026 Season</div>

<div class="logo-wrap">
  <img class="logo-img" src="FalconsLogo.png" alt="Falcons">
</div>

<div class="enter-wrap">
  <div class="enter-label">Tap anywhere to enter</div>
  <button class="enter-btn" onclick="enterSite()">Enter →</button>
</div>

<script>
const players = [
  { name: 'Lincoln Roth',   number: '1'  },
  { name: 'Maddox Terreta', number: '4'  },
  { name: 'Avery Kincaid',  number: '7'  },
  { name: 'Helena Turosik', number: '14' },
  { name: 'Maddy Kincaid',  number: '15' },
  { name: 'Forrest Perry',  number: '16' },
  { name: 'Collins Yoho',   number: '27' },
  { name: 'Jacob Fox',      number: '29' },
  { name: 'Reed Yoho',      number: '41' },
  { name: 'Alex Gibson',    number: '43' },
];

const W = window.innerWidth;
const H = window.innerHeight;
const cx = W / 2, cy = H / 2;
const safeR = Math.min(W, H) * 0.22; // keep clear of logo

const nodes = players.map((p, i) => {
  // Distribute evenly around the logo in an orbit
  const baseAngle = (i / players.length) * Math.PI * 2;
  const orbitR = Math.min(W, H) * (0.32 + (i % 3) * 0.06);

  return {
    ...p,
    x: cx + Math.cos(baseAngle) * orbitR,
    y: cy + Math.sin(baseAngle) * orbitR,
    vx: (Math.random() - 0.5) * 0.4,
    vy: (Math.random() - 0.5) * 0.4,
    angle: baseAngle,
    orbitR,
    orbitSpeed: (0.0003 + Math.random() * 0.0002) * (Math.random() > 0.5 ? 1 : -1),
    el: null,
  };
});

// Create DOM elements
nodes.forEach(n => {
  const el = document.createElement('div');
  el.className = 'player';
  el.textContent = `#${n.number} ${n.name}`;
  document.body.appendChild(el);
  n.el = el;
  // Stagger fade-in
  el.style.opacity = '0';
  el.style.transition = 'opacity 0.6s';
});

// Fade players in staggered
setTimeout(() => {
  nodes.forEach((n, i) => {
    setTimeout(() => { n.el.style.opacity = '1'; }, i * 100);
  });
}, 600);

let raf;
function animate(t) {
  nodes.forEach(n => {
    n.angle += n.orbitSpeed;
    // Gentle drift on top of orbit
    n.x = cx + Math.cos(n.angle) * n.orbitR + Math.sin(n.angle * 0.7) * 12;
    n.y = cy + Math.sin(n.angle) * n.orbitR * 0.55 + Math.cos(n.angle * 0.9) * 10;

    // Keep on screen
    const hw = n.el.offsetWidth / 2;
    const hh = n.el.offsetHeight / 2;
    n.x = Math.max(hw + 10, Math.min(W - hw - 10, n.x));
    n.y = Math.max(hh + 10, Math.min(H - hh - 10, n.y));

    n.el.style.left = (n.x - n.el.offsetWidth / 2) + 'px';
    n.el.style.top  = (n.y - n.el.offsetHeight / 2) + 'px';
  });
  raf = requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

function enterSite() {
  cancelAnimationFrame(raf);
  const curtain = document.getElementById('curtain');
  curtain.classList.add('closing');
  setTimeout(() => { window.location.href = 'leaderboard.html'; }, 500);
}

// Click anywhere to enter
document.body.addEventListener('click', e => {
  if (e.target.classList.contains('enter-btn')) return;
  enterSite();
});

// Handle resize
window.addEventListener('resize', () => location.reload());
</script>
</body>
</html>
