<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Falcons Hockey — Tournaments</title>
<link rel="stylesheet" href="style.css">
  <script data-goatcounter="https://kincaidmade.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo-block">
      <div class="logo-icon" aria-hidden="true">
        <img src="FalconsLogo.png" alt="Falcons logo" style="height:52px;width:52px;object-fit:contain;">
      </div>
      <div>
        <div class="team-name">Falcons</div>
        <div class="season-label" id="season-label">2026</div>
      </div>
    </div>
    <nav class="site-nav">
      <a href="index.html" class="nav-link">Leaderboard</a>
      <a href="tournament.html" class="nav-link active">Tournaments</a>
    </nav>
  </div>
</header>

<main class="main-content">
  <div id="tournaments-container">
    <p class="loading-cell">Loading tournaments…</p>
  </div>
</main>

<footer class="site-footer">
  <span>Falcons Hockey</span>
</footer>

<script>
async function loadData() {
  try {
    const res = await fetch('data/stats.json');
    const data = await res.json();
    document.getElementById('season-label').textContent = (data.season || '') + ' Season';
    renderTournaments(data);
  } catch(e) {
    document.getElementById('tournaments-container').innerHTML =
      '<p class="loading-cell" style="color:#c0392b">Could not load stats.json.</p>';
  }
}

function renderTournaments(data) {
  const el = document.getElementById('tournaments-container');
  if (!data.tournaments.length) {
    el.innerHTML = '<p class="no-games">No tournaments yet.</p>';
    return;
  }

  const played   = data.tournaments.filter(t => t.games.length > 0);
  const upcoming = data.tournaments.filter(t => t.games.length === 0);

  let html = '';

  if (played.length) {
    html += `<h2 class="section-title">Completed</h2>
    <div class="tournament-card-grid">
      ${played.map(t => tournamentCard(t, data)).join('')}
    </div>`;
  }

  if (upcoming.length) {
    html += `<h2 class="section-title" style="margin-top:32px">Upcoming</h2>
    <div class="tournament-card-grid">
      ${upcoming.map(t => tournamentCard(t, data)).join('')}
    </div>`;
  }

  el.innerHTML = html;
}

function tournamentCard(t, data) {
  let w = 0, l = 0, tie = 0, gf = 0, ga = 0, totalPts = 0;
  t.games.forEach(g => {
    gf += g.falcons_score; ga += g.opponent_score;
    if (g.falcons_score > g.opponent_score) w++;
    else if (g.falcons_score < g.opponent_score) l++;
    else tie++;
  });

  // Top scorer in tournament
  const ptMap = {};
  data.players.forEach(p => { ptMap[p.id] = { name: p.name, number: p.number, pts: 0 }; });
  t.games.forEach(g => g.stats.forEach(s => {
    if (ptMap[s.player_id]) ptMap[s.player_id].pts += (s.goals || 0) + (s.assists || 0);
  }));
  const topPlayer = Object.values(ptMap).sort((a,b) => b.pts - a.pts)[0];

  const isUpcoming = t.games.length === 0;
  const resultBadge = t.result
    ? `<span class="tournament-result-badge ${t.result.toLowerCase().includes('champion') ? 'badge-champion' : t.result.toLowerCase().includes('finalist') ? 'badge-finalist' : 'badge-finalist'}" style="font-size:11px">${t.result}</span>`
    : '';

  return `
  <a href="tournament-detail.html?t=${t.id}" class="tc-card">
    <div class="tc-header">
      <div class="tc-name-row">
        <div class="tc-name">${t.name}</div>
        ${resultBadge}
      </div>
      <div class="tc-meta">${formatDate(t.date)}${t.location ? ' · ' + t.location : ''}${countdown(t.date, isUpcoming)}</div>
    </div>
    ${isUpcoming
      ? `<div class="tc-upcoming">
          <span class="tc-upcoming-badge">Upcoming</span>
         </div>`
      : `<div class="tc-stats">
          <div class="tc-stat-block">
            <div class="tc-stat-val">${w}–${l}–${tie}</div>
            <div class="tc-stat-label">Record</div>
          </div>
          <div class="tc-stat-block">
            <div class="tc-stat-val">${gf}</div>
            <div class="tc-stat-label">GF</div>
          </div>
          <div class="tc-stat-block">
            <div class="tc-stat-val">${ga}</div>
            <div class="tc-stat-label">GA</div>
          </div>
          <div class="tc-stat-block">
            <div class="tc-stat-val">${topPlayer?.pts > 0 ? '#' + topPlayer.number : '—'}</div>
            <div class="tc-stat-label">Top scorer</div>
          </div>
        </div>`
    }
    <div class="tc-footer">
      <span class="tc-view">View details & photos →</span>
    </div>
  </a>`;
}

function countdown(dateStr, isUpcoming) {
  if (!isUpcoming) return '';
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr + 'T00:00:00');
  const days = Math.round((target - today) / (1000*60*60*24));
  if (days < 0) return '';
  if (days === 0) return ' · <span class="tc-countdown tc-countdown-today">Today!</span>';
  if (days === 1) return ' · <span class="tc-countdown">Tomorrow!</span>';
  return ` · <span class="tc-countdown">${days} days away</span>`;
}

function formatDate(d) {
  if (!d) return '';
  const dt = new Date(d + 'T12:00:00');
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

loadData();
</script>
</body>
</html>
